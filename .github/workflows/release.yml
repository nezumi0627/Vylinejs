name: Vylinejs release verification

on:
  push:
    tags:
      - "vylinejs-v*"

jobs:
  verify:
    name: Verify release source
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: deno test -A
      - run: deno check packages/linejs/base/mod.ts packages/linejs/client/mod.ts packages/agent/mod.ts
      - run: npm ci --prefix docs
      - run: npm run build --prefix docs
