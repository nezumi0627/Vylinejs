name: Vylinejs release verification

on:
  push:
    tags:
      - "vylinejs-v*"

jobs:
  verify:
    name: Verify release source
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v1
        with:
          deno-version: v2.x
      - run: deno test -A
      - run: deno check packages/linejs/base/mod.ts packages/linejs/client/mod.ts packages/agent/mod.ts
      - run: deno task docs:build
